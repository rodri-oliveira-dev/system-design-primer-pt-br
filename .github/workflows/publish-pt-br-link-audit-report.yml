name: Publicar relatório da auditoria pt-BR

on:
  pull_request_target:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write
  pull-requests: read

jobs:
  publish-report:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'docs/pt-br-translation'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout da branch de tradução
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout dos arquivos temporários da master
        uses: actions/checkout@v4
        with:
          ref: master
          path: .audit-source

      - name: Preparar dependências
        run: python -m pip install --disable-pip-version-check markdown-it-py beautifulsoup4 requests

      - name: Executar auditoria
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          import re
          import textwrap
          from pathlib import Path

          workflow = Path('.audit-source/.github/workflows/audit-pt-br-links-render.yml').read_text(encoding='utf-8')
          match = re.search(r"          python <<'PY'\n(.*?)\n          PY\n", workflow, flags=re.S)
          if not match:
              raise RuntimeError('Não foi possível extrair o script de auditoria')
          code = textwrap.dedent(match.group(1))
          exec(compile(code, 'audit_pt_br_links_render.py', 'exec'))
          PY

      - name: Commitar relatório na branch de tradução
        if: always()
        run: |
          if [ ! -f pt-br-link-render-audit.md ]; then
            printf '# Auditoria de links e renderização pt-BR\n\n- O job falhou antes de produzir o relatório.\n' > pt-br-link-render-audit.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pt-br-link-render-audit.md
          if git diff --cached --quiet; then
            echo 'Relatório sem alterações.'
            exit 0
          fi
          git commit -m 'chore(pt-BR): adiciona relatório temporário de links'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
