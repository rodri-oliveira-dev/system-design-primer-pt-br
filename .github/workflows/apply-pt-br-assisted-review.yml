name: Aplicar revisão assistida pt-BR

on:
  pull_request_target:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write
  pull-requests: read

jobs:
  review:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'docs/pt-br-translation' &&
      contains(github.event.pull_request.title, '[revisao-assistida]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout da branch de tradução
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Configurar autor dos commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Aplicar revisão linguística
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise RuntimeError(f'{path}: esperado {expected} ocorrência(s), encontrado {found}: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          readme = Path('README-pt-BR.md')
          contributing = Path('CONTRIBUTING-pt-BR.md')

          replacements = [
              ('Aprender a projetar sistemas escaláveis ajudará você a se tornar um profissional de engenharia melhor.',
               'Aprender a projetar sistemas escaláveis ajudará você a aprimorar sua atuação como profissional de engenharia.', 1),
              ('Ótimo para estudar durante deslocamentos ou quando estiver fora de casa.',
               'Esses baralhos são ótimos para estudar durante deslocamentos ou fora de casa.', 1),
              ('Como conduzir a discussão de uma pergunta de entrevista de design de sistemas.',
               'Como conduzir a discussão durante uma entrevista de design de sistemas.', 1),
              ('O Pinterest, por exemplo, poderia possuir microsserviços',
               'O Pinterest, por exemplo, poderia ter microsserviços', 1),
              ('Essa abordagem é encontrada em sistemas como o memcached.',
               'Essa abordagem é encontrada em sistemas como o Memcached.', 1),
              ('Workers na camada de aplicação também ajudam a viabilizar o [assincronismo](#assincronismo).',
               'Workers (processos de trabalho) na camada de aplicação também ajudam a viabilizar o [assincronismo](#assincronismo).', 1),
              ('Serviços como [CloudFlare](https://www.cloudflare.com/dns/)',
               'Serviços como [Cloudflare](https://www.cloudflare.com/dns/)', 1),
              ('[Etcd](https://coreos.com/etcd/docs/latest)',
               '[etcd](https://coreos.com/etcd/docs/latest)', 1),
              ('Consul e Etcd também possuem', 'Consul e etcd também possuem', 1),
              ('[Zookeeper](http://www.slideshare.net/sauravhaloi/introduction-to-apache-zookeeper)',
               '[ZooKeeper](http://www.slideshare.net/sauravhaloi/introduction-to-apache-zookeeper)', 2),
              ('uma aplicação publica um job na fila',
               'uma aplicação publica uma tarefa (*job*) na fila', 1),
              ('um worker retira o job da fila, processa-o e sinaliza sua conclusão.',
               'um *worker* retira a tarefa da fila, processa-a e sinaliza sua conclusão.', 1),
              ('O usuário não fica bloqueado e o job é processado em segundo plano.',
               'O usuário não fica bloqueado, e a tarefa é processada em segundo plano.', 1),
              ('bons tempos de resposta para os jobs que já estão aguardando processamento.',
               'bons tempos de resposta para as tarefas que já estão aguardando processamento.', 1),
              ('* [Sistema de Nomes de Domínio](#sistema-de-nomes-de-dominio)',
               '* [Sistema de nomes de domínio](#sistema-de-nomes-de-dominio)', 1),
              ('## Sistema de Nomes de Domínio', '## Sistema de nomes de domínio', 1),
              ('Um Sistema de Nomes de Domínio (DNS)', 'Um sistema de nomes de domínio (DNS)', 1),
              ('Protocolo de Transferência de Hipertexto — HTTP',
               'Protocolo de transferência de hipertexto — HTTP', 2),
              ('Protocolo de Controle de Transmissão — TCP',
               'Protocolo de controle de transmissão — TCP', 2),
              ('Protocolo de Datagrama do Usuário — UDP',
               'Protocolo de datagrama do usuário — UDP', 2),
              ('Chamada de Procedimento Remoto — RPC',
               'Chamada de procedimento remoto — RPC', 2),
              ('Transferência de Estado Representacional — REST',
               'Transferência de estado representacional — REST', 2),
              ('[Paypal Developer Blog]', '[PayPal Developer Blog]', 1),
              ('[Ebay Tech Blog]', '[eBay Tech Blog]', 1),
              ('[Hubspot Engineering Blog]', '[HubSpot Engineering Blog]', 1),
          ]
          for old, new, expected in replacements:
              replace_exact(readme, old, new, expected)

          contributing_replacements = [
              ('| Hypertext Transfer Protocol (HTTP) | Protocolo de Transferência de Hipertexto — HTTP |',
               '| Hypertext Transfer Protocol (HTTP) | Protocolo de transferência de hipertexto — HTTP |', 1),
              ('| Transmission Control Protocol (TCP) | Protocolo de Controle de Transmissão — TCP |',
               '| Transmission Control Protocol (TCP) | Protocolo de controle de transmissão — TCP |', 1),
              ('| User Datagram Protocol (UDP) | Protocolo de Datagrama do Usuário — UDP |',
               '| User Datagram Protocol (UDP) | Protocolo de datagrama do usuário — UDP |', 1),
              ('| Remote Procedure Call (RPC) | Chamada de Procedimento Remoto — RPC |',
               '| Remote Procedure Call (RPC) | Chamada de procedimento remoto — RPC |', 1),
              ('| Representational State Transfer (REST) | Transferência de Estado Representacional — REST |',
               '| Representational State Transfer (REST) | Transferência de estado representacional — REST |', 1),
              ('| message queue | fila de mensagens |\n| task queue | fila de tarefas |\n| back pressure | backpressure; apresentar “contrapressão” na definição |',
               '| message queue | fila de mensagens |\n| task queue | fila de tarefas |\n| job | tarefa — job; apresentar o termo original na primeira ocorrência |\n| worker | worker; apresentar “processo de trabalho” na primeira ocorrência |\n| back pressure | backpressure; apresentar “contrapressão” na definição |', 1),
          ]
          for old, new, expected in contributing_replacements:
              replace_exact(contributing, old, new, expected)
          PY

          git add README-pt-BR.md CONTRIBUTING-pt-BR.md
          git commit -m 'docs(pt-BR): aprimora fluidez e consistência editorial'

      - name: Aplicar revisão técnica
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise RuntimeError(f'{path}: esperado {expected} ocorrência(s), encontrado {found}: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          readme = Path('README-pt-BR.md')
          replacements = [
              ('Um banco de dados relacional, como um banco SQL, é uma coleção de itens de dados organizados em tabelas.',
               'Um banco de dados relacional organiza dados em tabelas relacionadas e normalmente utiliza SQL para definir, consultar e manipular essas informações.', 1),
              ('* throughput muito elevado de operações de entrada e saída — IOPS.',
               '* taxa muito elevada de operações de entrada e saída por segundo — IOPS.', 1),
              ('HTTP é um método para codificar e transportar dados entre um cliente e um servidor.',
               'HTTP é um protocolo para codificar e transportar dados entre um cliente e um servidor.', 1),
              ('TCP é um protocolo orientado a conexão utilizado sobre uma [rede IP](https://en.wikipedia.org/wiki/Internet_Protocol). A conexão é estabelecida e encerrada por meio de um [handshake](https://en.wikipedia.org/wiki/Handshaking). O protocolo garante que todos os pacotes enviados cheguem ao destino na ordem original e sem corrupção por meio de:',
               'TCP é um protocolo orientado a conexão utilizado sobre uma [rede IP](https://en.wikipedia.org/wiki/Internet_Protocol). A conexão é estabelecida e encerrada por meio de um [handshake](https://en.wikipedia.org/wiki/Handshaking). O protocolo fornece um fluxo confiável e ordenado de bytes, detectando corrupção e retransmitindo dados quando necessário, por meio de:', 1),
              ('Essas garantias introduzem atrasos e normalmente resultam em uma transmissão menos eficiente do que a realizada por UDP.',
               'Essas garantias acrescentam overhead e podem aumentar a latência em comparação com UDP.', 1),
              ('Entre os frameworks RPC conhecidos estão [Protobuf](https://developers.google.com/protocol-buffers/), [Thrift](https://thrift.apache.org/) e [Avro](https://avro.apache.org/docs/current/).',
               'Entre as tecnologias usadas em implementações RPC estão [Protocol Buffers](https://developers.google.com/protocol-buffers/), [Thrift](https://thrift.apache.org/) e [Avro](https://avro.apache.org/docs/current/).', 1),
              ('* quiser controlar como os erros serão tratados fora da biblioteca;',
               '* quiser controlar como os erros serão expostos e tratados pelos consumidores da biblioteca;', 1),
              ('Toda comunicação deve ser stateless e armazenável em cache.',
               'Toda comunicação deve ser stateless, e cada resposta deve indicar se pode ou não ser armazenada em cache.', 1),
              ('* **Manipulação por representações — verbos no HTTP** — utilize verbos, cabeçalhos e corpo.',
               '* **Manipulação de recursos por representações — verbos no HTTP** — utilize verbos, cabeçalhos e corpo.', 1),
              ('* Use `INT` para números maiores, até `2^32`, aproximadamente 4 bilhões.',
               '* Use `INT` para valores inteiros; no MySQL, o intervalo depende de a coluna ser assinada (`SIGNED`) ou não assinada (`UNSIGNED`).', 1),
              ('* Use `CHAR` em vez de `VARCHAR` para campos de tamanho fixo.\n    * `CHAR` permite acesso aleatório mais rápido; com `VARCHAR`, é necessário encontrar o final de uma string antes de avançar para a próxima.',
               '* Considere `CHAR` para campos realmente fixos e `VARCHAR` para comprimentos variáveis.\n    * O impacto de desempenho e armazenamento depende do SGBDR, do conjunto de caracteres e do padrão de acesso.', 1),
              ('* Use `TEXT` para grandes blocos de texto, como publicações de blog. `TEXT` também permite pesquisas booleanas. Um campo `TEXT` armazena em disco um ponteiro utilizado para localizar o bloco de texto.',
               '* Considere `TEXT` para grandes blocos de texto, como publicações de blog. Os recursos de busca textual dependem do SGBDR e dos índices configurados. O armazenamento físico de campos `TEXT` também varia conforme o mecanismo utilizado.', 1),
              ('* `VARCHAR(255)` utiliza o maior número de caracteres que pode ser representado por um número de 8 bits, frequentemente aproveitando melhor um byte em alguns SGBDRs.',
               '* `VARCHAR(255)` é comum por razões históricas e de compatibilidade, mas o tamanho deve ser definido conforme o domínio dos dados e o conjunto de caracteres, não como padrão universal.', 1),
              ('##### Ajuste o cache de consultas\n\n* Em alguns casos, o [cache de consultas](https://dev.mysql.com/doc/refman/5.7/en/query-cache.html) pode causar [problemas de desempenho](https://www.percona.com/blog/2016/10/12/mysql-5-7-performance-tuning-immediately-after-installation/).',
               '##### Ajuste o cache de consultas, quando disponível\n\n* Em versões e SGBDRs que oferecem esse recurso, o [cache de consultas](https://dev.mysql.com/doc/refman/5.7/en/query-cache.html) pode causar [problemas de desempenho](https://www.percona.com/blog/2016/10/12/mysql-5-7-performance-tuning-immediately-after-installation/).', 1),
              ('Muitos bancos NoSQL não oferecem transações ACID completas e favorecem a [consistência eventual](#consistência-eventual).',
               'O suporte a transações ACID varia entre produtos e escopos de operação; muitos modelos NoSQL ainda favorecem a [consistência eventual](#consistência-eventual).', 1),
              ('Um armazenamento chave-valor normalmente oferece leituras e escritas em `O(1)` e costuma utilizar memória ou SSD como base.',
               'Um armazenamento chave-valor pode oferecer leituras e escritas próximas de `O(1)`, conforme a estrutura e a implementação, e costuma utilizar memória ou SSD como base.', 1),
              ('Muitos bancos de grafos são acessados por [APIs REST](#transferencia-de-estado-representacional-rest).',
               'Muitos bancos de grafos também oferecem [APIs REST](#transferencia-de-estado-representacional-rest).', 1),
              ('A tradução do conteúdo principal, a revisão estrutural e a validação automatizada de links e renderização foram concluídas. O documento aguarda revisão técnica e linguística por falantes nativos.',
               'A tradução do conteúdo principal, a revisão estrutural, duas passagens técnicas e linguísticas assistidas e a validação automatizada de links e renderização foram concluídas. O documento aguarda revisão técnica e linguística por falantes nativos.', 1),
              ('- [x] primeira passagem técnica e linguística assistida;\n- [ ] revisão técnica e linguística por falantes nativos;',
               '- [x] primeira passagem técnica e linguística assistida;\n- [x] segunda passagem técnica e linguística assistida;\n- [ ] revisão técnica e linguística por falantes nativos;', 1),
          ]
          for old, new, expected in replacements:
              replace_exact(readme, old, new, expected)
          PY

          git add README-pt-BR.md
          git commit -m 'docs(pt-BR): corrige precisão técnica da tradução'

      - name: Validar alterações
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git diff --check HEAD~2..HEAD
          python <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          files = [Path('README-pt-BR.md'), Path('CONTRIBUTING-pt-BR.md'), Path('CONTRIBUTING.md')]
          for path in files:
              text = path.read_text(encoding='utf-8')
              if text.count('```') % 2:
                  raise RuntimeError(f'{path}: quantidade ímpar de delimitadores de código')

              anchors = re.findall(r'<a id="([^"]+)"></a>', text)
              duplicates = sorted({anchor for anchor in anchors if anchors.count(anchor) > 1})
              if duplicates:
                  raise RuntimeError(f'{path}: âncoras explícitas duplicadas: {duplicates}')

              request = urllib.request.Request(
                  'https://api.github.com/markdown',
                  data=json.dumps({
                      'text': text,
                      'mode': 'gfm',
                      'context': os.environ['GITHUB_REPOSITORY'],
                  }).encode('utf-8'),
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                      'Content-Type': 'application/json',
                      'User-Agent': 'system-design-primer-pt-br-assisted-review',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path}: falha na renderização GFM: HTTP {response.status}')

          readme = Path('README-pt-BR.md').read_text(encoding='utf-8')
          required = [
              '- [x] segunda passagem técnica e linguística assistida;',
              '- [ ] revisão técnica e linguística por falantes nativos;',
              'HTTP é um protocolo para codificar e transportar dados',
              'cada resposta deve indicar se pode ou não ser armazenada em cache',
              'Protocol Buffers',
          ]
          for item in required:
              if item not in readme:
                  raise RuntimeError(f'conteúdo esperado ausente: {item}')
          PY

      - name: Enviar commits para a branch
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
