name: Aplicar tradução pt-BR — entrevistas com soluções

on:
  pull_request_target:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-translation:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'docs/pt-br-translation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch de tradução
        uses: actions/checkout@v4
        with:
          ref: docs/pt-br-translation
          fetch-depth: 0

      - name: Traduzir perguntas de entrevista com soluções
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README-pt-BR.md")
          contributing_path = Path("CONTRIBUTING-pt-BR.md")

          readme = readme_path.read_text(encoding="utf-8")
          contributing = contributing_path.read_text(encoding="utf-8")

          system_anchor = '<a id="perguntas-de-entrevista-de-design-de-sistemas-com-solucoes"></a>'
          ood_anchor = '<a id="perguntas-de-entrevista-de-design-orientado-a-objetos-com-solucoes"></a>'
          if system_anchor in readme or ood_anchor in readme:
              raise RuntimeError("As seções de entrevistas com soluções já foram adicionadas")

          replacements = {
              "README.md#system-design-interview-questions-with-solutions": "#perguntas-de-entrevista-de-design-de-sistemas-com-solucoes",
              "README.md#object-oriented-design-interview-questions-with-solutions": "#perguntas-de-entrevista-de-design-orientado-a-objetos-com-solucoes",
          }
          for old, new in replacements.items():
              readme = readme.replace(old, new)

          marker = "\n## Tópicos de design de sistemas: comece aqui\n"
          if marker not in readme:
              raise RuntimeError("Marcador para inserção das seções não encontrado")

          translated = r'''
<a id="perguntas-de-entrevista-de-design-de-sistemas-com-solucoes"></a>
## Perguntas de entrevista de design de sistemas com soluções

> Perguntas comuns de entrevista de design de sistemas com exemplos de discussão, código e diagramas.
>
> As soluções estão vinculadas ao conteúdo da pasta `solutions/`.

| Pergunta | |
|---|---|
| Projete o Pastebin.com — ou Bit.ly | [Solução](solutions/system_design/pastebin/README.md) |
| Projete a timeline e a pesquisa do Twitter — ou o feed e a pesquisa do Facebook | [Solução](solutions/system_design/twitter/README.md) |
| Projete um rastreador web | [Solução](solutions/system_design/web_crawler/README.md) |
| Projete o Mint.com | [Solução](solutions/system_design/mint/README.md) |
| Projete as estruturas de dados de uma rede social | [Solução](solutions/system_design/social_graph/README.md) |
| Projete um armazenamento chave-valor para um mecanismo de busca | [Solução](solutions/system_design/query_cache/README.md) |
| Projete o recurso de ranking de vendas da Amazon por categoria | [Solução](solutions/system_design/sales_rank/README.md) |
| Projete um sistema que escale para milhões de usuários na AWS | [Solução](solutions/system_design/scaling_aws/README.md) |
| Adicione uma pergunta de design de sistemas | [Contribua](#como-contribuir) |

### Projete o Pastebin.com — ou Bit.ly

[Veja o exercício e a solução](solutions/system_design/pastebin/README.md)

![Imgur](images/4edXG0T.png)

### Projete a timeline e a pesquisa do Twitter — ou o feed e a pesquisa do Facebook

[Veja o exercício e a solução](solutions/system_design/twitter/README.md)

![Imgur](images/jrUBAF7.png)

### Projete um rastreador web

[Veja o exercício e a solução](solutions/system_design/web_crawler/README.md)

![Imgur](images/bWxPtQA.png)

### Projete o Mint.com

[Veja o exercício e a solução](solutions/system_design/mint/README.md)

![Imgur](images/V5q57vU.png)

### Projete as estruturas de dados de uma rede social

[Veja o exercício e a solução](solutions/system_design/social_graph/README.md)

![Imgur](images/cdCv5g7.png)

### Projete um armazenamento chave-valor para um mecanismo de busca

[Veja o exercício e a solução](solutions/system_design/query_cache/README.md)

![Imgur](images/4j99mhe.png)

### Projete o recurso de ranking de vendas da Amazon por categoria

[Veja o exercício e a solução](solutions/system_design/sales_rank/README.md)

![Imgur](images/MzExP06.png)

### Projete um sistema que escale para milhões de usuários na AWS

[Veja o exercício e a solução](solutions/system_design/scaling_aws/README.md)

![Imgur](images/jj3A5N8.png)

<a id="perguntas-de-entrevista-de-design-orientado-a-objetos-com-solucoes"></a>
## Perguntas de entrevista de design orientado a objetos com soluções

> Perguntas comuns de entrevista de design orientado a objetos com exemplos de discussão, código e diagramas.
>
> As soluções estão vinculadas ao conteúdo da pasta `solutions/`.

> **Observação: esta seção está em desenvolvimento.**

| Pergunta | |
|---|---|
| Projete um mapa de hash | [Solução](solutions/object_oriented_design/hash_table/hash_map.ipynb) |
| Projete um cache LRU — Least Recently Used | [Solução](solutions/object_oriented_design/lru_cache/lru_cache.ipynb) |
| Projete uma central de atendimento | [Solução](solutions/object_oriented_design/call_center/call_center.ipynb) |
| Projete um baralho de cartas | [Solução](solutions/object_oriented_design/deck_of_cards/deck_of_cards.ipynb) |
| Projete um estacionamento | [Solução](solutions/object_oriented_design/parking_lot/parking_lot.ipynb) |
| Projete um servidor de chat | [Solução](solutions/object_oriented_design/online_chat/online_chat.ipynb) |
| Projete um array circular | [Contribua](#como-contribuir) |
| Adicione uma pergunta de design orientado a objetos | [Contribua](#como-contribuir) |
'''

          readme = readme.replace(marker, "\n" + translated.strip() + "\n" + marker, 1)

          status_marker = "- [x] abordagem para entrevistas de design de sistemas;"
          status_addition = (
              "- [x] abordagem para entrevistas de design de sistemas;\n"
              "- [x] perguntas de entrevista de design de sistemas e design orientado a objetos com soluções;"
          )
          if status_marker not in readme:
              raise RuntimeError("Linha de status esperada não encontrada")
          readme = readme.replace(status_marker, status_addition, 1)

          glossary_marker = "| nanosecond / microsecond / millisecond | nanossegundo / microssegundo / milissegundo; preservar as unidades ns, us e ms em tabelas |"
          glossary_addition = """| nanosecond / microsecond / millisecond | nanossegundo / microssegundo / milissegundo; preservar as unidades ns, us e ms em tabelas |
| system design interview question | pergunta de entrevista de design de sistemas |
| object-oriented design (OOD) | design orientado a objetos — OOD |
| web crawler | rastreador web |
| hash map | mapa de hash |
| least recently used cache (LRU) | cache LRU — Least Recently Used |
| call center | central de atendimento |"""
          if glossary_marker not in contributing:
              raise RuntimeError("Marcador do glossário não encontrado")
          contributing = contributing.replace(glossary_marker, glossary_addition, 1)

          readme_path.write_text(readme.rstrip() + "\n", encoding="utf-8")
          contributing_path.write_text(contributing.rstrip() + "\n", encoding="utf-8")
          PY

      - name: Validar alterações
        shell: bash
        run: |
          grep -q '<a id="perguntas-de-entrevista-de-design-de-sistemas-com-solucoes"></a>' README-pt-BR.md
          grep -q '<a id="perguntas-de-entrevista-de-design-orientado-a-objetos-com-solucoes"></a>' README-pt-BR.md
          grep -q 'solutions/system_design/scaling_aws/README.md' README-pt-BR.md
          grep -q 'solutions/object_oriented_design/online_chat/online_chat.ipynb' README-pt-BR.md
          grep -q '\[x\] perguntas de entrevista de design de sistemas e design orientado a objetos com soluções' README-pt-BR.md
          grep -q 'least recently used cache (LRU)' CONTRIBUTING-pt-BR.md
          ! grep -q 'README.md#system-design-interview-questions-with-solutions' README-pt-BR.md
          ! grep -q 'README.md#object-oriented-design-interview-questions-with-solutions' README-pt-BR.md

      - name: Commitar tradução
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README-pt-BR.md CONTRIBUTING-pt-BR.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente"
            exit 0
          fi
          git commit -m "docs(pt-BR): traduz entrevistas com soluções"
          git push origin HEAD:docs/pt-br-translation
