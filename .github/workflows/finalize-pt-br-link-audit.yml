name: Finalizar auditoria de links pt-BR

on:
  pull_request_target:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'docs/pt-br-translation' &&
      contains(github.event.pull_request.title, '[finalizar auditoria]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch de tradução
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout do script temporário da master
        uses: actions/checkout@v4
        with:
          ref: master
          path: .automation-source

      - name: Finalizar auditoria
        run: python .automation-source/.github/scripts/finalize_pt_br_link_audit.py

      - name: Validar resultado
        run: |
          test ! -f pt-br-link-render-audit.md
          grep -Fq -- '- [x] validação de links externos e renderização final.' README-pt-BR.md
          ! grep -Fq -- '- [ ] validação de links externos e renderização final.' README-pt-BR.md

      - name: Commitar finalização
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README-pt-BR.md pt-br-link-render-audit.md
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git commit -m 'docs(pt-BR): conclui validação de links e renderização'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
