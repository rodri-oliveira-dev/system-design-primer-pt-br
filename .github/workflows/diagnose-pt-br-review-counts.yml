name: Auditar contagens da revisão assistida pt-BR

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 1 &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/diagnose-pt-br-review-counts'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout da branch de tradução
        uses: actions/checkout@v4
        with:
          ref: docs/pt-br-translation
          fetch-depth: 0

      - name: Obter executor da master
        uses: actions/checkout@v4
        with:
          ref: master
          path: .review-source

      - name: Auditar todas as correspondências
        run: |
          python <<'PY'
          import ast
          import re
          import textwrap
          from pathlib import Path

          source = Path('.review-source/.github/workflows/apply-pt-br-assisted-review.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python <<'PY'\n(.*?)\n          PY", source, flags=re.S)

          def assignments(code: str):
              tree = ast.parse(textwrap.dedent(code))
              result = {}
              for node in tree.body:
                  if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                      name = node.targets[0].id
                      if name in {'replacements', 'contributing_replacements'}:
                          result[name] = ast.literal_eval(node.value)
              return result

          readme = Path('README-pt-BR.md').read_text(encoding='utf-8')
          contributing = Path('CONTRIBUTING-pt-BR.md').read_text(encoding='utf-8')
          report = [f'Blocos encontrados: {len(blocks)}', '']

          language = assignments(blocks[0])
          technical = assignments(blocks[1])

          checks = [
              ('linguística/README', readme, language.get('replacements', [])),
              ('linguística/CONTRIBUTING', contributing, language.get('contributing_replacements', [])),
              ('técnica/README', readme, technical.get('replacements', [])),
          ]

          mismatches = 0
          for scope, text, entries in checks:
              report.append(f'[{scope}]')
              for old, new, expected in entries:
                  found = text.count(old)
                  if found != expected:
                      mismatches += 1
                      report.append(f'ESPERADO={expected} ENCONTRADO={found} :: {old!r}')
              if not any(text.count(old) != expected for old, new, expected in entries):
                  report.append('OK')
              report.append('')

          report.insert(1, f'Divergências: {mismatches}')
          Path('.pt-br-assisted-review-counts.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY

      - name: Publicar auditoria na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pt-br-assisted-review-counts.txt
          git commit -m 'chore: registra contagens temporárias da revisão pt-BR'
          git push origin HEAD:docs/pt-br-translation
