name: Aplicar tradução pt-BR — arquiteturas

on:
  pull_request_target:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-translation:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'docs/pt-br-translation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch de tradução
        uses: actions/checkout@v4
        with:
          ref: docs/pt-br-translation
          fetch-depth: 0

      - name: Executar tradução
        shell: bash
        run: |
          git fetch origin master
          git show origin/master:.github/scripts/apply_pt_br_architectures.py > /tmp/apply_pt_br_architectures.py
          python /tmp/apply_pt_br_architectures.py

      - name: Validar alterações
        shell: bash
        run: |
          grep -q '<a id="outras-perguntas-de-entrevista-de-design-de-sistemas"></a>' README-pt-BR.md
          grep -q '<a id="arquiteturas-do-mundo-real"></a>' README-pt-BR.md
          grep -q '<a id="arquiteturas-de-empresas"></a>' README-pt-BR.md
          grep -q '<a id="blogs-de-engenharia-de-empresas"></a>' README-pt-BR.md
          grep -q 'Projete um limitador de taxa para APIs' README-pt-BR.md
          grep -q 'Lessons Learned From Scaling Uber' README-pt-BR.md
          grep -q '\[x\] perguntas adicionais, arquiteturas e blogs de engenharia' README-pt-BR.md
          grep -q 'company engineering blog' CONTRIBUTING-pt-BR.md
          ! grep -q 'README.md#additional-system-design-interview-questions' README-pt-BR.md
          ! grep -q 'README.md#real-world-architectures' README-pt-BR.md
          ! grep -q 'README.md#company-architectures' README-pt-BR.md
          ! grep -q 'README.md#company-engineering-blogs' README-pt-BR.md

      - name: Commitar tradução
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README-pt-BR.md CONTRIBUTING-pt-BR.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente"
            exit 0
          fi
          git commit -m "docs(pt-BR): traduz perguntas adicionais e arquiteturas"
          git push origin HEAD:docs/pt-br-translation
