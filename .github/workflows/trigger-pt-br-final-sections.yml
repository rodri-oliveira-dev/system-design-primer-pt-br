name: Aplicar tradução pt-BR — seções finais

on:
  pull_request_target:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-translation:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'docs/pt-br-translation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch de tradução
        uses: actions/checkout@v4
        with:
          ref: docs/pt-br-translation
          fetch-depth: 0

      - name: Executar tradução das seções finais
        shell: bash
        run: |
          git fetch origin master
          git show origin/master:.github/scripts/apply_pt_br_final_sections.py > /tmp/apply_pt_br_final_sections.py
          python /tmp/apply_pt_br_final_sections.py

      - name: Validar alterações
        shell: bash
        run: |
          grep -q '<a id="em-desenvolvimento"></a>' README-pt-BR.md
          grep -q '<a id="creditos"></a>' README-pt-BR.md
          grep -q '<a id="informacoes-de-contato"></a>' README-pt-BR.md
          grep -q '<a id="licenca"></a>' README-pt-BR.md
          grep -q '\[x\] seção em desenvolvimento, créditos, informações de contato e licença' README-pt-BR.md
          grep -q 'consistent hashing' CONTRIBUTING-pt-BR.md
          ! grep -q 'README.md#under-development' README-pt-BR.md
          ! grep -q 'README.md#credits' README-pt-BR.md
          ! grep -q 'README.md#contact-info' README-pt-BR.md
          ! grep -q 'README.md#license' README-pt-BR.md

      - name: Commitar tradução
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README-pt-BR.md CONTRIBUTING-pt-BR.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente"
            exit 0
          fi
          git commit -m "docs(pt-BR): traduz seções finais do README"
          git push origin HEAD:docs/pt-br-translation
