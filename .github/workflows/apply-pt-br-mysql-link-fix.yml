name: Aplicar ajuste final de link MySQL pt-BR

on:
  pull_request_target:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-fix:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'docs/pt-br-translation' &&
      contains(github.event.pull_request.title, '[corrigir mysql]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch de tradução
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout dos scripts temporários da master
        uses: actions/checkout@v4
        with:
          ref: master
          path: .automation-source

      - name: Aplicar correção
        run: python .automation-source/.github/scripts/apply_pt_br_mysql_link_fix.py

      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README-pt-BR.md pt-br-link-render-audit.md
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git commit -m 'docs(pt-BR): atualiza referência de otimização MySQL'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
