name: Acionar tradução pt-BR — apêndice

on:
  pull_request_target:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-translation:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'docs/pt-br-translation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch de tradução
        uses: actions/checkout@v4
        with:
          ref: docs/pt-br-translation
          fetch-depth: 0

      - name: Extrair e executar tradução do apêndice
        shell: bash
        run: |
          git fetch origin master
          git show origin/master:.github/workflows/apply-pt-br-appendix.yml > /tmp/appendix-workflow.yml
          python - <<'PY'
          from pathlib import Path

          workflow = Path('/tmp/appendix-workflow.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validar alterações"
          if start_marker not in workflow or end_marker not in workflow:
              raise RuntimeError('Bloco Python da tradução não encontrado')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = script.splitlines()
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/apply_appendix.py').write_text(normalized + '\n', encoding='utf-8')
          PY
          python /tmp/apply_appendix.py

      - name: Validar alterações
        shell: bash
        run: |
          grep -q '<a id="apendice"></a>' README-pt-BR.md
          grep -q '### Tabela de potências de dois' README-pt-BR.md
          grep -q '### Números de latência que todo programador deve conhecer' README-pt-BR.md
          grep -q '\[x\] apêndice: tabela de potências de dois e números de latência' README-pt-BR.md
          grep -q 'back-of-the-envelope estimate' CONTRIBUTING-pt-BR.md

      - name: Commitar tradução
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README-pt-BR.md CONTRIBUTING-pt-BR.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente"
            exit 0
          fi
          git commit -m "docs(pt-BR): traduz apêndice e números de latência"
          git push origin HEAD:docs/pt-br-translation
