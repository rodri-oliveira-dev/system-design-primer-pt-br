name: Acionar tradução pt-BR — entrevistas com soluções

on:
  pull_request_target:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-translation:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'docs/pt-br-translation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch de tradução
        uses: actions/checkout@v4
        with:
          ref: docs/pt-br-translation
          fetch-depth: 0

      - name: Extrair e executar tradução das entrevistas
        shell: bash
        run: |
          git fetch origin master
          git show origin/master:.github/workflows/apply-pt-br-interview-solutions.yml > /tmp/interview-workflow.yml
          python - <<'PY'
          from pathlib import Path

          workflow = Path('/tmp/interview-workflow.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validar alterações"
          if start_marker not in workflow or end_marker not in workflow:
              raise RuntimeError('Bloco Python da tradução não encontrado')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = script.splitlines()
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/apply_interviews.py').write_text(normalized + '\n', encoding='utf-8')
          PY
          python /tmp/apply_interviews.py

      - name: Validar alterações
        shell: bash
        run: |
          grep -q '<a id="perguntas-de-entrevista-de-design-de-sistemas-com-solucoes"></a>' README-pt-BR.md
          grep -q '<a id="perguntas-de-entrevista-de-design-orientado-a-objetos-com-solucoes"></a>' README-pt-BR.md
          grep -q 'solutions/system_design/scaling_aws/README.md' README-pt-BR.md
          grep -q 'solutions/object_oriented_design/online_chat/online_chat.ipynb' README-pt-BR.md
          grep -q '\[x\] perguntas de entrevista de design de sistemas e design orientado a objetos com soluções' README-pt-BR.md
          grep -q 'least recently used cache (LRU)' CONTRIBUTING-pt-BR.md

      - name: Commitar tradução
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README-pt-BR.md CONTRIBUTING-pt-BR.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente"
            exit 0
          fi
          git commit -m "docs(pt-BR): traduz entrevistas com soluções"
          git push origin HEAD:docs/pt-br-translation
